name: Build or flash issue
description: Report build or flash problems
labels: ['bug']
body:
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - movecall-cuican-esp32s3
        - movecall-moji-esp32s3
        - movecall-moji2-esp32c5
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: idf_version
    attributes:
      label: ESP-IDF version
      placeholder: "e.g. v5.5.2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Build or serial log
      render: shell
