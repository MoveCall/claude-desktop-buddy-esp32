name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-S3 (CuiCan)
            board: movecall-cuican-esp32s3
            target: esp32s3
          - name: ESP32-S3 (Moji)
            board: movecall-moji-esp32s3
            target: esp32s3
          - name: ESP32-C5 (Moji2)
            board: movecall-moji2-esp32c5
            target: esp32c5
          - name: ESP32-S3 (ATK-BOX0)
            board: atk-dnesp32s3-box0
            target: esp32s3
          - name: ESP32-S3 (Magiclick 2P5)
            board: magiclick-2p5
            target: esp32s3
          - name: ESP32-S3 (M5Stack CoreS3)
            board: m5stack-core-s3
            target: esp32s3
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py -DBOARD=${{ matrix.board }} set-target ${{ matrix.target }}
          idf.py build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build/claude-desktop-buddy.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package firmwares
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd artifacts
          for dir in firmware-*; do
            board="${dir#firmware-}"
            tar czf "${VERSION}-buddy-${board}.tar.gz" -C "$dir" .
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/${{ github.ref_name }}-buddy-*.tar.gz
